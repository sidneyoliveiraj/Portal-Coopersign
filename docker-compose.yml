services:
  postgres:
    image: postgres:16-alpine
    container_name: coopersign-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: coopersign
      POSTGRES_PASSWORD: coopersign
      POSTGRES_DB: coopersign
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
